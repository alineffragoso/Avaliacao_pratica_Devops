<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Livros</title>
</head>
<body>
  <h1>Cadastro de Livros</h1>

  <form id="form">
    <input id="titulo" placeholder="Título do livro" required><br>
    <input id="autor" placeholder="Autor" required><br>
    <input id="preco" type="number" step="0.01" placeholder="Preço" required><br>
    <input id="estoque" type="number" step="1" placeholder="Quantidade em estoque" required><br>
    <button type="submit">Cadastrar</button>
  </form>

  <p id="msg"></p>
  <a href="#" id="listar">Listar todos os livros</a>
  <ul id="lista"></ul>

  <script>
    const API = "__API_URL__";

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const dados = {
        titulo: document.getElementById('titulo').value,
        autor: document.getElementById('autor').value,
        preco: parseFloat(document.getElementById('preco').value),
        estoque: parseInt(document.getElementById('estoque').value)
      };
      const r = await fetch(API + '/livro', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      });
      document.getElementById('msg').textContent = r.ok ? 'Livro cadastrado!' : 'Erro ao cadastrar';
      if (r.ok) e.target.reset();
    });

    document.getElementById('listar').addEventListener('click', async (e) => {
      e.preventDefault();
      const r = await fetch(API + '/livros');
      const livros = await r.json();
      const ul = document.getElementById('lista');
      ul.innerHTML = '';
      livros.forEach(l => {
        const li = document.createElement('li');
        li.textContent = `${l.titulo} - ${l.autor} - R$ ${l.preco} - Estoque: ${l.estoque}`;
        ul.appendChild(li);
      });
    });
  </script>
</body>
</html>
